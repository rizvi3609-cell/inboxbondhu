# Dev stack — prompt.md §9 Phase 0 item 7.
# Mongo runs as a SINGLE-NODE REPLICA SET (required for transactions T1–T4).
# Redis runs with maxmemory-policy=noeviction (INV-11; asserted again at boot).
services:
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: initiates the replica set, then exits.
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    entrypoint: >
      mongosh --host mongo --quiet --eval
      "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }"

  redis:
    image: redis:7
    command: ['redis-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  mongo-express:
    image: mongo-express:1
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?replicaSet=rs0
      ME_CONFIG_BASICAUTH: 'false'

  redis-commander:
    image: rediscommander/redis-commander:latest
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '8082:8081'
    environment:
      REDIS_HOSTS: local:redis:6379

volumes:
  mongo-data:
  redis-data:
